# Belarusian texts of the Git panel plugin; keys and placeholders mirror messages.properties.
# Use the typographic apostrophe ’ (U+2019), never ', which MessageFormat treats as a quote.
# Terms: працоўнае дрэва (working tree), індэкс (staging area), галіна (branch), каміт (commit),
# схованка (stash), люстэрка (mirror), аддалены рэпазіторый (remote). Git command names stay in English.

