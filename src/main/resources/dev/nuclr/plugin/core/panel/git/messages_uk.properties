# Ukrainian texts of the Git panel plugin; keys and placeholders mirror messages.properties.
# Use the typographic apostrophe ’ (U+2019), never ', which MessageFormat treats as a quote.
# Terms: робоче дерево (working tree), індекс (staging area), гілка (branch), коміт (commit),
# схованка (stash), дзеркало (mirror), віддалений репозиторій (remote). Git command names stay in English.

